<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07195a"/>
      <stop offset="1" stop-color="#020b2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff4a3"/>
      <stop offset="0.48" stop-color="#ffd700"/>
      <stop offset="1" stop-color="#b8730a"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Subtle ring -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="#ffd700" stroke-width="14" opacity="0.18"/>
  <!-- ATM card body -->
  <rect x="92" y="168" width="328" height="210" rx="28" fill="url(#gold)"/>
  <!-- Card dark overlay for depth -->
  <rect x="92" y="168" width="328" height="210" rx="28" fill="#020b2e" opacity="0.12"/>
  <!-- Chip -->
  <rect x="132" y="208" width="62" height="48" rx="8" fill="#c8860a"/>
  <rect x="138" y="214" width="50" height="36" rx="5" fill="#ffd700" opacity="0.6"/>
  <line x1="163" y1="214" x2="163" y2="250" stroke="#b8730a" stroke-width="2.5"/>
  <line x1="138" y1="232" x2="188" y2="232" stroke="#b8730a" stroke-width="2.5"/>
  <!-- Contactless symbol -->
  <path d="M226 221 Q238 232 226 243" fill="none" stroke="#020b2e" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <path d="M240 212 Q262 232 240 252" fill="none" stroke="#020b2e" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <path d="M254 203 Q286 232 254 261" fill="none" stroke="#020b2e" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <!-- Card stripe band -->
  <rect x="92" y="290" width="328" height="42" fill="#020b2e" opacity="0.28"/>
  <!-- Asterisk digits simulation -->
  <rect x="132" y="316" width="18" height="10" rx="3" fill="#020b2e" opacity="0.45"/>
  <rect x="162" y="316" width="18" height="10" rx="3" fill="#020b2e" opacity="0.45"/>
  <rect x="192" y="316" width="18" height="10" rx="3" fill="#020b2e" opacity="0.45"/>
  <rect x="222" y="316" width="18" height="10" rx="3" fill="#020b2e" opacity="0.45"/>
  <!-- Last 4 digits area (lighter) -->
  <rect x="310" y="312" width="80" height="18" rx="4" fill="#020b2e" opacity="0.22"/>
</svg>
